<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中壢平鎮聯賣區｜成交行情</title>
  <style>
    :root{--ink:#172033;--muted:#64748b;--line:#e2e8f0;--paper:#f6f8fc;--brand:#155e75;--white:#fff;--red:#dc2626}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}.shell{max-width:1280px;margin:auto;padding:28px 22px 52px}.hero{display:flex;align-items:end;justify-content:space-between;gap:24px;padding:28px 30px;color:#fff;border-radius:20px;background:linear-gradient(125deg,#0f3f52,#17778b);box-shadow:0 14px 30px rgba(15,63,82,.18)}.eyebrow{margin:0 0 8px;font-size:13px;letter-spacing:.13em;font-weight:700;color:#bceaf1}h1{margin:0;font-size:clamp(25px,4vw,38px)}.hero p{margin:10px 0 0;color:#d3f1f4}.updated{font-size:14px;white-space:nowrap}.notice{margin:18px 0;padding:12px 15px;border:1px solid #bae6fd;border-radius:12px;background:#f0f9ff;color:#075985;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.stat{min-height:112px;padding:19px;background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 14px rgba(15,23,42,.035)}.stat span{display:block;color:var(--muted);font-size:14px}.stat strong{display:block;margin-top:8px;font-size:29px;letter-spacing:-.03em}.stat small{color:var(--muted);font-size:12px}.controls{display:grid;grid-template-columns:repeat(5,1fr) auto;gap:11px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px}select,button{min-height:43px;border-radius:10px;font:inherit}select{width:100%;padding:0 12px;color:var(--ink);background:#fff;border:1px solid #cbd5e1}button{padding:0 17px;color:#fff;background:var(--brand);border:0;font-weight:700;cursor:pointer}.result{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px;color:var(--muted);font-size:14px}.result b{color:var(--brand);font-size:16px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}table{width:100%;min-width:940px;border-collapse:collapse}th,td{padding:14px 15px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;white-space:nowrap}th{position:sticky;top:0;z-index:1;color:#475569;background:#f8fafc;font-size:13px}th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--brand)}tbody tr:hover{background:#f0fdfa}.name{max-width:310px;overflow:hidden;text-overflow:ellipsis;font-weight:600}.price{font-variant-numeric:tabular-nums;font-weight:700}.badge{display:inline-flex;align-items:center;padding:4px 9px;color:#fff;background:var(--red);border-radius:6px;font-size:12px;font-weight:800;letter-spacing:.04em}.plain{color:#94a3b8}.mobile-list{display:none}.card{margin-bottom:12px;padding:17px;background:#fff;border:1px solid var(--line);border-radius:14px}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.card h3{margin:0;font-size:16px;line-height:1.45}.store{margin:7px 0 13px;color:var(--muted);font-size:13px}.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card-grid div{padding:8px;background:#f8fafc;border-radius:9px}.card-grid span{display:block;color:var(--muted);font-size:11px}.card-grid b{display:block;margin-top:3px;font-size:14px}.empty{padding:42px;color:var(--muted);text-align:center}@media(max-width:820px){.shell{padding:16px 14px 38px}.hero{align-items:start;flex-direction:column;padding:23px 20px}.updated{white-space:normal}.stats{grid-template-columns:repeat(3,1fr);gap:8px}.stat{min-height:94px;padding:12px}.stat strong{font-size:22px}.controls{grid-template-columns:1fr 1fr;padding:12px}.controls button{grid-column:span 2}.table-wrap{display:none}.mobile-list{display:block}.result{margin-top:17px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero"><div><p class="eyebrow">ZHONGLI · PINGZHEN MLS</p><h1>中壢平鎮聯賣區｜成交行情</h1><p>依月份、區域、產品類別、店家與專約狀態快速查看成交條件。</p></div><p class="updated" id="updatedMonth">資料載入中</p></section>
    <p class="notice">本頁資料以每月成交明細 Excel 匯入；目前顯示的 2026 年 6 月共有 55 筆有效成交資料。</p>
    <section class="stats" aria-label="成交摘要"><article class="stat"><span>目前顯示成交筆數</span><strong id="count">—</strong><small>依篩選條件即時計算</small></article><article class="stat"><span>專委率</span><strong id="exclusiveRate">—</strong><small>專約成交件數／全部成交件數</small></article><article class="stat"><span>平均議價率</span><strong id="avgDiscount">—</strong><small>開價與成交價的平均差距</small></article></section>
    <section class="controls" aria-label="篩選成交資料"><select id="month" aria-label="選擇資料月份"></select><select id="area"><option value="">所有區域</option></select><select id="type"><option value="">所有產品類別</option></select><select id="store"><option value="">所有店家</option></select><select id="exclusive"><option value="">專約狀態：全部</option><option value="true">只看專約</option><option value="false">非專約</option></select><button id="reset" type="button">清除篩選</button></section>
    <div class="result"><span>成交案件 <b id="resultCount">0</b> 筆</span><span>點擊欄位名稱可排序</span></div>
    <div class="table-wrap"><table><thead><tr><th>店家</th><th>案名</th><th>產品類別</th><th>區域</th><th class="sort" data-key="asking">開價 ↕</th><th class="sort" data-key="sold">成交價 ↕</th><th class="sort" data-key="ratio">成交達成率 ↕</th><th>專約</th></tr></thead><tbody id="tableBody"></tbody></table></div>
    <section class="mobile-list" id="mobileList"></section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const format = value => value == null ? '—' : new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2}).format(value);
    let deals = [], months = [], sortKey = 'sold', sortDir = -1;
    const productType = name => /農地|建地|土地/.test(name) ? '土地' : /透天|別墅/.test(name) ? '透天／別墅' : /店面|透店/.test(name) ? '店面' : /套房/.test(name) ? '套房' : '大樓／華廈';
    function resetOptions(id, label, values) { $(id).innerHTML = `<option value="">${label}</option>` + [...new Set(values.filter(Boolean))].sort().map(value => `<option value="${value}">${value}</option>`).join(''); }
    function filtered() { const area=$('area').value,type=$('type').value,store=$('store').value,exclusive=$('exclusive').value; return deals.filter(x => (!area||x.area===area)&&(!type||x.type===type)&&(!store||x.store===store)&&(exclusive===''||String(x.exclusive)===exclusive)).sort((a,b)=>((a[sortKey]??-Infinity)-(b[sortKey]??-Infinity))*sortDir); }
    function render() { const items=filtered(), discounts=items.filter(x=>x.asking&&x.sold).map(x=>(1-x.sold/x.asking)*100); $('count').textContent=items.length;$('resultCount').textContent=items.length;$('exclusiveRate').textContent=items.length?(items.filter(x=>x.exclusive).length/items.length*100).toFixed(1)+'%':'—';$('avgDiscount').textContent=discounts.length?(discounts.reduce((a,b)=>a+b,0)/discounts.length).toFixed(1)+'%':'—';$('tableBody').innerHTML=items.map(x=>`<tr><td>${x.store}</td><td class="name" title="${x.name}">${x.name}</td><td>${x.type}</td><td>${x.area||'—'}</td><td>${format(x.asking)}</td><td class="price">${format(x.sold)}</td><td class="price">${x.ratio==null?'—':x.ratio.toFixed(1)+'%'}</td><td>${x.exclusive?'<span class="badge">專約</span>':'<span class="plain">—</span>'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">找不到符合條件的成交資料</td></tr>';$('mobileList').innerHTML=items.map(x=>`<article class="card"><div class="card-head"><h3>${x.name}</h3>${x.exclusive?'<span class="badge">專約</span>':''}</div><p class="store">${x.store} · ${x.area||'未填區域'} · ${x.type}</p><div class="card-grid"><div><span>開價</span><b>${format(x.asking)} 萬</b></div><div><span>成交價</span><b>${format(x.sold)} 萬</b></div><div><span>成交達成率</span><b>${x.ratio==null?'—':x.ratio.toFixed(1)+'%'}</b></div></div></article>`).join('')||'<p class="empty">找不到符合條件的成交資料</p>'; }
    async function loadMonth(id) { const selected=months.find(x=>x.id===id); deals=await fetch(selected.file).then(r=>r.json()); deals.forEach(x=>{x.type=productType(x.name);x.ratio=x.asking&&x.sold?x.sold/x.asking*100:null});resetOptions('area','所有區域',deals.map(x=>x.area));resetOptions('type','所有產品類別',deals.map(x=>x.type));resetOptions('store','所有店家',deals.map(x=>x.store));$('exclusive').value='';$('updatedMonth').textContent=`資料月份：${selected.label}`;render(); }
    async function init() { months=await fetch('data/months.json').then(r=>r.json());$('month').innerHTML=months.map(x=>`<option value="${x.id}">${x.label}</option>`).join('');await loadMonth(months[0].id); }
    ['area','type','store','exclusive'].forEach(id=>$(id).addEventListener('change',render));$('month').addEventListener('change',event=>loadMonth(event.target.value));$('reset').addEventListener('click',()=>{$('area').value='';$('type').value='';$('store').value='';$('exclusive').value='';render()});document.querySelectorAll('th.sort').forEach(th=>th.addEventListener('click',()=>{const key=th.dataset.key;sortDir=key===sortKey?-sortDir:-1;sortKey=key;render()}));init().catch(()=>{$('tableBody').innerHTML='<tr><td colspan="8" class="empty">資料載入失敗，請重新整理頁面。</td></tr>'});
  </script>
</body>
</html>
