<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中壢平鎮聯賣區｜成交行情看板</title>
  <style>
    :root { --ink:#172033; --muted:#64748b; --line:#e2e8f0; --paper:#f6f8fc; --brand:#155e75; --accent:#f59e0b; --white:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; }
    .shell { max-width:1280px; margin:auto; padding:28px 22px 52px; }
    .hero { display:flex; align-items:end; justify-content:space-between; gap:24px; padding:28px 30px; color:#fff; border-radius:20px; background:linear-gradient(125deg,#0f3f52,#17778b); box-shadow:0 14px 30px rgba(15,63,82,.18); }
    .eyebrow { margin:0 0 8px; font-size:13px; letter-spacing:.13em; font-weight:700; color:#bceaf1; }
    h1 { margin:0; font-size:clamp(25px,4vw,38px); letter-spacing:.02em; }
    .hero p { margin:10px 0 0; color:#d3f1f4; }
    .updated { margin:0; font-size:14px; white-space:nowrap; color:#d3f1f4; }
    .notice { margin:18px 0; padding:12px 15px; border:1px solid #fde7b2; border-radius:12px; background:#fff9e9; color:#8a5700; font-size:14px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:18px 0; }
    .stat { min-height:118px; padding:20px; background:var(--white); border:1px solid var(--line); border-radius:16px; box-shadow:0 5px 14px rgba(15,23,42,.035); }
    .stat span { display:block; color:var(--muted); font-size:14px; }
    .stat strong { display:block; margin-top:8px; font-size:29px; letter-spacing:-.03em; }
    .stat small { color:var(--muted); font-size:12px; }
    .controls { display:grid; grid-template-columns:1.4fr 1fr 1fr 1.2fr auto; gap:11px; padding:16px; background:#fff; border:1px solid var(--line); border-radius:16px; }
    input, select, button { min-height:43px; border-radius:10px; font:inherit; }
    input, select { width:100%; padding:0 12px; color:var(--ink); background:#fff; border:1px solid #cbd5e1; }
    button { padding:0 17px; color:#fff; background:var(--brand); border:0; font-weight:700; cursor:pointer; }
    .result { display:flex; justify-content:space-between; align-items:center; margin:20px 2px 10px; color:var(--muted); font-size:14px; }
    .result b { color:var(--brand); font-size:16px; }
    .table-wrap { overflow:auto; background:#fff; border:1px solid var(--line); border-radius:16px; }
    table { width:100%; min-width:940px; border-collapse:collapse; }
    th, td { padding:14px 15px; border-bottom:1px solid var(--line); text-align:left; font-size:14px; white-space:nowrap; }
    th { position:sticky; top:0; z-index:1; color:#475569; background:#f8fafc; font-size:13px; }
    th.sort { cursor:pointer; user-select:none; }
    th.sort:hover { color:var(--brand); }
    tbody tr { transition:background .15s; }
    tbody tr:hover { background:#f0fdfa; }
    .name { max-width:290px; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
    .price { font-variant-numeric:tabular-nums; font-weight:700; }
    .badge { display:inline-flex; align-items:center; padding:4px 8px; color:#0f766e; background:#ccfbf1; border-radius:999px; font-size:12px; font-weight:700; }
    .plain { color:#94a3b8; }
    .mobile-list { display:none; }
    .card { margin-bottom:12px; padding:17px; background:#fff; border:1px solid var(--line); border-radius:14px; }
    .card-head { display:flex; justify-content:space-between; gap:10px; align-items:start; }
    .card h3 { margin:0; font-size:16px; line-height:1.45; }
    .store { margin:7px 0 13px; color:var(--muted); font-size:13px; }
    .card-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
    .card-grid div { padding:8px; background:#f8fafc; border-radius:9px; }
    .card-grid span { display:block; color:var(--muted); font-size:11px; }
    .card-grid b { display:block; margin-top:3px; font-size:14px; }
    .empty { padding:42px; color:var(--muted); text-align:center; }
    @media (max-width:820px) { .shell{padding:16px 14px 38px}.hero{align-items:start;flex-direction:column;padding:23px 20px}.updated{white-space:normal}.stats{grid-template-columns:repeat(3,1fr);gap:8px}.stat{min-height:94px;padding:12px}.stat strong{font-size:22px}.controls{grid-template-columns:1fr 1fr;padding:12px}.controls input{grid-column:span 2}button{grid-column:span 2}.table-wrap{display:none}.mobile-list{display:block}.result{margin-top:17px}.card-grid{grid-template-columns:repeat(3,1fr)} }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div><p class="eyebrow">ZHONGLI · PINGZHEN MLS</p><h1>中壢平鎮聯賣區｜成交行情</h1><p>2026 年 6 月成交物件彙整，快速掌握成交條件與議價狀況。</p></div>
      <p class="updated">資料月份：2026／06</p>
    </section>
    <p class="notice">示範版：以下先放入照片中可辨識的部分成交資料，正式上線前請以原始成交表／Excel 校正完整資料。</p>
    <section class="stats" aria-label="成交摘要">
      <article class="stat"><span>目前顯示成交筆數</span><strong id="count">0</strong><small>依目前篩選條件計算</small></article>
      <article class="stat"><span>專委率</span><strong id="exclusiveRate">—</strong><small>專約成交件數／全部成交件數</small></article>
      <article class="stat"><span>平均議價率</span><strong id="avgDiscount">—</strong><small>開價與成交價的平均差距</small></article>
    </section>
    <section class="controls" aria-label="篩選成交資料">
      <input id="keyword" type="search" placeholder="搜尋案名或店家" />
      <select id="area"><option value="">所有區域</option></select>
      <select id="type"><option value="">所有產品類別</option></select>
      <select id="exclusive"><option value="">專約狀態：全部</option><option value="true">只看專約</option><option value="false">非專約／未標示</option></select>
      <button id="reset" type="button">清除篩選</button>
    </section>
    <div class="result"><span>成交案件 <b id="resultCount">0</b> 筆</span><span>點擊欄位名稱可排序</span></div>
    <div class="table-wrap"><table><thead><tr>
      <th>店家</th><th>案名</th><th>產品類別</th><th>區域</th><th class="sort" data-key="asking">開價 ↕</th><th class="sort" data-key="sold">成交價 ↕</th><th class="sort" data-key="ratio">成交達成率 ↕</th><th>專約</th>
    </tr></thead><tbody id="tableBody"></tbody></table></div>
    <section class="mobile-list" id="mobileList"></section>
  </main>
  <script>
    // 示範資料：正式使用時可直接替換成每月匯入的 JSON 或 CSV 資料。
    const deals = [
      { store:'YC中壢高功加盟店', name:'水闊觀音工業區旁平坦漂亮農地', area:'觀音區', size:1488.64, asking:2768, sold:2678, unit:1.79, exclusive:true },
      { store:'YC中壢高功加盟店', name:'SOGO中壢火車站低樓層4間收租套房', area:'中壢區', size:24.77, asking:698, sold:630, unit:25.43, exclusive:true },
      { store:'YC中壢高功加盟店', name:'近SOGO海華火車站三鐵共構景觀美宅', area:'中壢區', size:21.15, asking:888, sold:793, unit:37.49, exclusive:false },
      { store:'YC中壢高功加盟店', name:'過嶺重劃區電梯F1三角窗大地坪透天', area:'楊梅區', size:27.26, asking:980, sold:800, unit:29.34, exclusive:true },
      { store:'YC中壢高功加盟店', name:'龍潭行政區優美車庫五樓稀有美華廈', area:'龍潭區', size:34.55, asking:777, sold:680, unit:19.68, exclusive:true },
      { store:'YC內壢忠孝吉富加盟店', name:'近中壢高中・A22捷運・公園第一排質感美三房', area:'中壢區', size:25.288, asking:880, sold:680, unit:26.89, exclusive:true },
      { store:'YC內壢忠孝吉富加盟店', name:'近忠貞市場金透店', area:'中壢區', size:87.459, asking:2600, sold:2290, unit:26.18, exclusive:true },
      { store:'YC內壢忠孝吉富加盟店', name:'桃園愛買武陵高中旁優樓美寓', area:'桃園區', size:25.446, asking:568, sold:470, unit:18.47, exclusive:true },
      { store:'YC中壢慈善加盟店', name:'內壢站前商圈四房車', area:'中壢區', size:54.63, asking:1180, sold:990, unit:18.12, exclusive:false },
      { store:'YC中壢慈善加盟店', name:'內壢站前黃金店面車位', area:'中壢區', size:35.03, asking:1398, sold:1300, unit:37.11, exclusive:false },
      { store:'YC中壢慈善加盟店', name:'龍潭美食圈三房車位', area:'龍潭區', size:47.53, asking:1398, sold:1200, unit:25.25, exclusive:false },
      { store:'YC中壢慈善加盟店', name:'近內壢火車站三房美車', area:'中壢區', size:27.69, asking:898, sold:870, unit:31.42, exclusive:false },
      { store:'YC中壢環西結盟加盟店', name:'八德農地', area:'八德區', size:149.1, asking:1180, sold:1020, unit:6.84, exclusive:true },
      { store:'YC中壢環西結盟加盟店', name:'龍潭美別墅', area:'龍潭區', size:70.9, asking:1228, sold:1050, unit:14.81, exclusive:true },
      { store:'YC中壢環西結盟加盟店', name:'國王之森三房車', area:'桃園區', size:46.5, asking:2298, sold:1950, unit:41.94, exclusive:true },
      { store:'UT中壢環中加盟店', name:'國鐵名園3房', area:'中壢區', size:30.482, asking:668, sold:620, unit:20.10, exclusive:true },
      { store:'UT中壢環中加盟店', name:'天琢三房車', area:'中壢區', size:39.072, asking:1098, sold:1030, unit:25.83, exclusive:true },
      { store:'UT中壢環中加盟店', name:'星友街透天', area:'平鎮區', size:36.073, asking:498, sold:416, unit:11.53, exclusive:true },
      { store:'UT中壢環東加盟店', name:'G11藝文中壢愛家電梯3房+平面車位', area:'桃園區', size:40.12, asking:1288, sold:1100, unit:27.42, exclusive:false },
      { store:'UT中壢環東加盟店', name:'幼獅工業區高景國小旁漂亮透天4房4衛', area:'楊梅區', size:28.43, asking:898, sold:810, unit:28.49, exclusive:false },
      { store:'UT中壢SOGO加盟店', name:'有夠小資3房車', area:'中壢區', size:55.71, asking:1438, sold:1390, unit:24.95, exclusive:true },
      { store:'UT中壢SOGO加盟店', name:'通霄帝國4房車', area:'平鎮區', size:60.32, asking:1098, sold:940, unit:15.58, exclusive:true },
      { store:'UT中壢SOGO加盟店', name:'環中豪樂3改2房', area:'中壢區', size:38.31, asking:1088, sold:1030, unit:26.89, exclusive:false },
      { store:'UT中壢後站加盟店', name:'過嶺新案路大地坪透天', area:'楊梅區', size:27.261, asking:null, sold:800, unit:29.35, exclusive:true },
      { store:'UT中壢後站加盟店', name:'京元城', area:'中壢區', size:49.764, asking:1456, sold:1345, unit:32.06, exclusive:true },
      { store:'UT中壢後站加盟店', name:'大清哈佛', area:'中壢區', size:50.811, asking:1598, sold:1470, unit:29.72, exclusive:true },
      { store:'UT內壢車站加盟店', name:'內壢後站質感裝潢美四房+車位', area:'中壢區', size:60.92, asking:1328, sold:1280, unit:21.01, exclusive:true },
      { store:'UT內壢車站加盟店', name:'青埔捷運A19站泳池美別墅', area:'中壢區', size:109, asking:3358, sold:3100, unit:28.46, exclusive:true },
      { store:'TC中壢A23捷行加盟店', name:'體育園區近10米路面寬小坪數建地', area:'中壢區', size:35.71, asking:2300, sold:2200, unit:61.6, exclusive:true },
      { store:'TC中壢A23捷行加盟店', name:'近平鎮中壢未來雙捷運站1房', area:'平鎮區', size:8.44, asking:258, sold:198, unit:23.45, exclusive:false },
      { store:'TC平鎮文化豐盈加盟店', name:'聯新建地', area:'平鎮區', size:38.34, asking:2280, sold:1920, unit:50, exclusive:true }
    ];
    const $ = id => document.getElementById(id);
    const format = value => value == null ? '—' : new Intl.NumberFormat('zh-TW', { maximumFractionDigits:2 }).format(value);
    function productType(name) {
      if (/農地|建地|土地/.test(name)) return '土地';
      if (/透天|別墅/.test(name)) return '透天／別墅';
      if (/店面|透店/.test(name)) return '店面';
      if (/套房/.test(name)) return '套房';
      return '大樓／華廈';
    }
    deals.forEach(deal => {
      deal.type = productType(deal.name);
      deal.ratio = deal.asking && deal.sold ? deal.sold / deal.asking * 100 : null;
    });
    let sortKey = 'sold', sortDir = -1;
    function fillOptions(id, values) { $(id).insertAdjacentHTML('beforeend', [...new Set(values)].sort().map(v => `<option value="${v}">${v}</option>`).join('')); }
    fillOptions('area', deals.map(x => x.area)); fillOptions('type', deals.map(x => x.type));
    function filtered() {
      const keyword = $('keyword').value.trim().toLowerCase(), area = $('area').value, type = $('type').value, exclusive = $('exclusive').value;
      return deals.filter(x => (!keyword || `${x.name}${x.store}${x.area}${x.type}`.toLowerCase().includes(keyword)) && (!area || x.area === area) && (!type || x.type === type) && (exclusive === '' || String(x.exclusive) === exclusive)).sort((a,b) => ((a[sortKey] ?? -Infinity) - (b[sortKey] ?? -Infinity)) * sortDir);
    }
    function render() {
      const items = filtered();
      $('count').textContent = items.length;
      $('resultCount').textContent = items.length;
      const discounts = items.filter(x => x.asking && x.sold).map(x => (1 - x.sold/x.asking)*100);
      $('exclusiveRate').textContent = items.length ? (items.filter(x => x.exclusive).length / items.length * 100).toFixed(1) + '%' : '—';
      $('avgDiscount').textContent = discounts.length ? (discounts.reduce((a,b)=>a+b,0)/discounts.length).toFixed(1)+'%' : '—';
      const rows = items.map(x => `<tr><td>${x.store}</td><td class="name" title="${x.name}">${x.name}</td><td>${x.type}</td><td>${x.area}</td><td>${format(x.asking)}</td><td class="price">${format(x.sold)}</td><td class="price">${x.ratio == null ? '—' : x.ratio.toFixed(1) + '%'}</td><td>${x.exclusive ? '<span class="badge">專約</span>' : '<span class="plain">—</span>'}</td></tr>`).join('');
      $('tableBody').innerHTML = rows || '<tr><td colspan="8" class="empty">找不到符合條件的成交資料</td></tr>';
      $('mobileList').innerHTML = items.map(x => `<article class="card"><div class="card-head"><h3>${x.name}</h3>${x.exclusive ? '<span class="badge">專約</span>' : ''}</div><p class="store">${x.store} · ${x.area} · ${x.type}</p><div class="card-grid"><div><span>開價</span><b>${format(x.asking)} 萬</b></div><div><span>成交價</span><b>${format(x.sold)} 萬</b></div><div><span>成交達成率</span><b>${x.ratio == null ? '—' : x.ratio.toFixed(1) + '%'}</b></div></div></article>`).join('') || '<p class="empty">找不到符合條件的成交資料</p>';
    }
    ['keyword','area','type','exclusive'].forEach(id => $(id).addEventListener(id === 'keyword' ? 'input' : 'change', render));
    $('reset').addEventListener('click', () => { ['keyword','area','type','exclusive'].forEach(id => $(id).value=''); render(); });
    document.querySelectorAll('th.sort').forEach(th => th.addEventListener('click', () => { const key=th.dataset.key; sortDir = key === sortKey ? -sortDir : -1; sortKey=key; render(); }));
    render();
  </script>
</body>
</html>
