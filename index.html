<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中壢平鎮聯賣區｜成交行情</title>
  <style>
    :root{--ink:#162330;--muted:#667787;--line:#dbe3e9;--paper:#edf1f2;--brand:#133842;--gold:#d7a745;--cream:#fffdf8;--red:#c83035}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 100% 0,#dce8e5 0,transparent 32%),var(--paper);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}.shell{max-width:1180px;margin:auto;padding:30px 22px 60px}.hero{position:relative;overflow:hidden;display:flex;align-items:end;justify-content:space-between;gap:24px;padding:39px 40px;color:#fff;border-radius:28px;background:linear-gradient(125deg,#0d2731,#174b52 62%,#22666b);box-shadow:0 24px 55px rgba(16,47,54,.22)}.hero:after{content:"";position:absolute;width:320px;height:320px;right:-100px;top:-160px;border:1px solid rgba(215,167,69,.55);border-radius:50%;box-shadow:0 0 0 30px rgba(215,167,69,.08),0 0 0 64px rgba(215,167,69,.06)}.eyebrow{position:relative;z-index:1;margin:0 0 12px;font-size:11px;letter-spacing:.22em;font-weight:800;color:#e6c97f}h1{position:relative;z-index:1;margin:0;font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(28px,4vw,44px);font-weight:700;letter-spacing:.035em}.hero p{position:relative;z-index:1;margin:12px 0 0;color:#c9dcda}.updated{position:relative;z-index:1;padding:10px 14px;border:1px solid rgba(255,255,255,.28);border-radius:999px;font-size:13px;white-space:nowrap}.notice{margin:18px 2px;padding:0;color:#75838b;background:transparent;border:0;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.stat{position:relative;min-height:125px;padding:21px 22px;background:var(--cream);border:1px solid rgba(19,56,66,.08);border-radius:18px;box-shadow:0 10px 24px rgba(22,35,48,.06)}.stat:first-child{background:var(--brand);color:#fff}.stat span{display:block;color:var(--muted);font-size:13px;font-weight:700}.stat:first-child span,.stat:first-child small{color:#b6d0cc}.stat strong{display:block;margin-top:9px;font-family:Georgia,"Noto Serif TC",serif;font-size:34px;letter-spacing:-.04em}.stat small{color:var(--muted);font-size:11px}.controls{display:grid;grid-template-columns:repeat(5,1fr) auto;gap:10px;padding:13px;background:rgba(255,253,248,.78);border:1px solid rgba(19,56,66,.1);border-radius:18px;box-shadow:0 10px 24px rgba(22,35,48,.04);backdrop-filter:blur(10px)}select,button{min-height:46px;border-radius:11px;font:inherit}select{width:100%;padding:0 13px;color:#26363e;background:#fff;border:1px solid #d5dee1;font-size:14px}button{padding:0 18px;color:#143841;background:#e8c97f;border:0;font-weight:800;cursor:pointer}.result{display:flex;justify-content:space-between;align-items:center;margin:24px 3px 11px;color:var(--muted);font-size:13px}.result b{color:var(--brand);font-size:19px}.table-wrap{overflow:auto;background:var(--cream);border:1px solid rgba(19,56,66,.1);border-radius:18px;box-shadow:0 10px 24px rgba(22,35,48,.04)}table{width:100%;min-width:940px;border-collapse:collapse}th,td{padding:16px 15px;border-bottom:1px solid #e8ecec;text-align:left;font-size:14px;white-space:nowrap}th{position:sticky;top:0;z-index:1;color:#718087;background:#f3f6f4;font-size:12px;letter-spacing:.04em}th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--brand)}tbody tr:hover{background:#f6fbf9}.name{max-width:310px;overflow:hidden;text-overflow:ellipsis;font-weight:800}.price{font-variant-numeric:tabular-nums;font-weight:800;color:#173c43}.badge{display:inline-flex;align-items:center;padding:5px 10px;color:#fff;background:var(--red);border-radius:5px;font-size:12px;font-weight:800;letter-spacing:.08em;box-shadow:0 4px 10px rgba(200,48,53,.2)}.plain{color:#a5b0b5}.mobile-list{display:none}.card{position:relative;margin-bottom:13px;padding:18px;background:var(--cream);border:1px solid rgba(19,56,66,.1);border-radius:17px;box-shadow:0 8px 18px rgba(22,35,48,.045)}.card:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;background:var(--gold);border-radius:0 4px 4px 0}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:start;padding-left:7px}.card h3{margin:0;font-size:17px;line-height:1.5;letter-spacing:.01em}.store{margin:7px 0 14px;padding-left:7px;color:#718087;font-size:12px}.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.card-grid div{padding:10px 8px;background:#f0f4f2;border-radius:10px}.card-grid div:nth-child(2){background:#e8f0ed}.card-grid span{display:block;color:#7d8c92;font-size:11px}.card-grid b{display:block;margin-top:4px;color:#143841;font-size:14px}.empty{padding:42px;color:var(--muted);text-align:center}@media(max-width:820px){.shell{padding:16px 14px 42px}.hero{align-items:start;flex-direction:column;padding:30px 24px;border-radius:22px}.hero:after{right:-155px;top:-190px}.updated{white-space:normal}.stats{grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.stat{min-height:100px;padding:14px 11px;border-radius:14px}.stat span{font-size:11px}.stat strong{font-size:25px}.stat small{display:none}.controls{grid-template-columns:1fr 1fr;padding:11px;border-radius:15px}.controls button{grid-column:span 2}.table-wrap{display:none}.mobile-list{display:block}.result{margin-top:18px}}
    @media(max-width:820px){h1{font-size:31px;line-height:1.22}.hero>div>p:not(.eyebrow){font-size:13px;line-height:1.65}.notice{margin:14px 4px;font-size:12px;line-height:1.55}.card{padding:19px 16px 16px;border-radius:16px}.card h3{font-size:17px;line-height:1.45}.card-head{padding-left:8px}.store{padding-left:8px;margin:8px 0 15px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{padding:5px 8px;font-size:11px}.card-grid{gap:7px}.card-grid div{min-width:0;padding:10px 7px}.card-grid span{font-size:10px}.card-grid b{font-size:13px;white-space:nowrap}.result span:last-child{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero"><div><p class="eyebrow">ZHONGLI · PINGZHEN MLS</p><h1>中壢平鎮聯賣區｜成交行情</h1><p>依月份、區域、產品類別、店家與專約狀態快速查看成交條件。</p></div><p class="updated" id="updatedMonth">資料載入中</p></section>
    <p class="notice" id="notice">本頁資料以每月成交明細 Excel 匯入。</p>
    <section class="stats" aria-label="成交摘要"><article class="stat"><span>目前顯示成交筆數</span><strong id="count">—</strong><small>依篩選條件即時計算</small></article><article class="stat"><span>專委率</span><strong id="exclusiveRate">—</strong><small>專約成交件數／全部成交件數</small></article><article class="stat"><span>平均議價率</span><strong id="avgDiscount">—</strong><small>開價與成交價的平均差距</small></article></section>
    <section class="controls" aria-label="篩選成交資料"><select id="month" aria-label="選擇資料月份"></select><select id="area"><option value="">所有區域</option></select><select id="type"><option value="">所有產品類別</option></select><select id="store"><option value="">所有店家</option></select><select id="exclusive"><option value="">專約狀態：全部</option><option value="true">只看專約</option><option value="false">非專約</option></select><button id="reset" type="button">清除篩選</button></section>
    <div class="result"><span>成交案件 <b id="resultCount">0</b> 筆</span><span>點擊欄位名稱可排序</span></div>
    <div class="table-wrap"><table><thead><tr><th>店家</th><th>案名</th><th>產品類別</th><th>區域</th><th class="sort" data-key="asking">開價 ↕</th><th class="sort" data-key="sold">成交價 ↕</th><th class="sort" data-key="ratio">議價率 ↕</th><th>專約</th></tr></thead><tbody id="tableBody"></tbody></table></div>
    <section class="mobile-list" id="mobileList"></section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const format = value => value == null ? '—' : new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2}).format(value);
    let deals = [], months = [], sortKey = 'sold', sortDir = -1;
    const productType = name => /農地|農業地|建地|土地|用地|持分地/.test(name) ? '土地' : /透天|別墅/.test(name) ? '透天／別墅' : /店面|透店/.test(name) ? '店面' : /套房/.test(name) ? '套房' : '大樓／華廈';
    function resetOptions(id, label, values) { $(id).innerHTML = `<option value="">${label}</option>` + [...new Set(values.filter(Boolean))].sort().map(value => `<option value="${value}">${value}</option>`).join(''); }
    function filtered() { const area=$('area').value,type=$('type').value,store=$('store').value,exclusive=$('exclusive').value; return deals.filter(x => (!area||x.area===area)&&(!type||x.type===type)&&(!store||x.store===store)&&(exclusive===''||String(x.exclusive)===exclusive)).sort((a,b)=>((a[sortKey]??-Infinity)-(b[sortKey]??-Infinity))*sortDir); }
    function render() { const items=filtered(), discounts=items.filter(x=>x.ratio!=null).map(x=>x.ratio); $('count').textContent=items.length;$('resultCount').textContent=items.length;$('exclusiveRate').textContent=items.length?(items.filter(x=>x.exclusive).length/items.length*100).toFixed(1)+'%':'—';$('avgDiscount').textContent=discounts.length?(discounts.reduce((a,b)=>a+b,0)/discounts.length).toFixed(1)+'%':'—';$('tableBody').innerHTML=items.map(x=>`<tr><td>${x.store}</td><td class="name" title="${x.name}">${x.name}</td><td>${x.type}</td><td>${x.area||'—'}</td><td>${format(x.asking)}</td><td class="price">${format(x.sold)}</td><td class="price">${x.ratio==null?'—':x.ratio.toFixed(1)+'%'}</td><td>${x.exclusive?'<span class="badge">專約</span>':'<span class="plain">—</span>'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">找不到符合條件的成交資料</td></tr>';$('mobileList').innerHTML=items.map(x=>`<article class="card"><div class="card-head"><h3>${x.name}</h3>${x.exclusive?'<span class="badge">專約</span>':''}</div><p class="store">${x.store} · ${x.area||'未填區域'} · ${x.type}</p><div class="card-grid"><div><span>開價</span><b>${format(x.asking)} 萬</b></div><div><span>成交價</span><b>${format(x.sold)} 萬</b></div><div><span>議價率</span><b>${x.ratio==null?'—':x.ratio.toFixed(1)+'%'}</b></div></div></article>`).join('')||'<p class="empty">找不到符合條件的成交資料</p>'; }
    async function loadMonth(id) { const selected=months.find(x=>x.id===id); deals=(await fetch(selected.file).then(r=>r.json())).filter(x=>x.asking); deals.forEach(x=>{x.type=productType(x.name);x.ratio=x.asking&&x.sold?(1-x.sold/x.asking)*100:null});resetOptions('area','所有區域',deals.map(x=>x.area));resetOptions('type','所有產品類別',deals.map(x=>x.type));resetOptions('store','所有店家',deals.map(x=>x.store));$('exclusive').value='';$('updatedMonth').textContent=`資料月份：${selected.label}`;$('notice').textContent=`本頁資料以每月成交明細 Excel 匯入；目前顯示的 ${selected.label}共有 ${deals.length} 筆成交資料（未填開價者不列入）。`;render(); }
    async function init() { months=await fetch('data/months.json').then(r=>r.json());$('month').innerHTML=months.map(x=>`<option value="${x.id}">${x.label}</option>`).join('');await loadMonth(months[0].id); }
    ['area','type','store','exclusive'].forEach(id=>$(id).addEventListener('change',render));$('month').addEventListener('change',event=>loadMonth(event.target.value));$('reset').addEventListener('click',()=>{$('area').value='';$('type').value='';$('store').value='';$('exclusive').value='';render()});document.querySelectorAll('th.sort').forEach(th=>th.addEventListener('click',()=>{const key=th.dataset.key;sortDir=key===sortKey?-sortDir:-1;sortKey=key;render()}));init().catch(()=>{$('tableBody').innerHTML='<tr><td colspan="8" class="empty">資料載入失敗，請重新整理頁面。</td></tr>'});
  </script>
</body>
</html>
